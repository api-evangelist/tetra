name: Tetra
description: >-
  Tetra (Tetra AI) was a Seattle, Washington startup building on-device AI models
  for vision, audio, and speech, optimized to run efficiently on mobile, compute,
  automotive, and IoT hardware. Backed by Wing Venture Capital and Shield Capital,
  the company was acquired by Qualcomm on October 1, 2023 and its technology and
  team were absorbed into Qualcomm's AI model and Snapdragon efforts. As an
  independent company Tetra no longer operates a standalone website, developer
  portal, or public API surface, so there are no API artifacts to enrich. This
  profile is retained as a Wing Venture Capital portfolio record with its identity
  reconciled to the acquired entity.
